<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>一纸锦囊 - 截图</title>
<link rel="stylesheet" href="_styles.css">
<style>
  body { width: 360px; height: 540px; }
</style>
</head>
<body>
<div class="window" id="window">
  <div class="title-bar">
    <div class="drag-region">
      <div class="title-dropdown">
        <span class="title">一纸锦囊</span>
        <span class="title-chevron">▾</span>
      </div>
    </div>
    <div class="window-controls">
      <button class="window-btn">+</button>
      <button class="window-btn">↻</button>
      <button class="window-btn">⌕</button>
      <button class="window-btn">△</button>
      <button class="window-btn">⌄</button>
      <button class="window-btn">–</button>
      <button class="window-btn">✕</button>
    </div>
  </div>

  <div class="favorites-tags">
    <span class="fav-tag active">全部 <span class="count">11</span></span>
    <span class="fav-tag">设计 <span class="count">4</span></span>
    <span class="fav-tag">工具 <span class="count">3</span></span>
    <span class="fav-tag">阅读 <span class="count">2</span></span>
    <span class="fav-tag">代码 <span class="count">2</span></span>
  </div>

  <div class="content-area">
    <div class="favorites-list">
      <div class="favorite-item">
        <div class="favorite-item-header">
          <div class="favorite-title">████████████</div>
          <div class="favorite-actions">
            <button class="favorite-action-btn">改</button>
            <button class="favorite-action-btn">删</button>
          </div>
        </div>
        <div class="favorite-desc">██████████████████████████ ████████ ████ ████████</div>
        <a class="favorite-link-btn">↗ 打开链接</a>
        <div class="favorite-tags">
          <span class="favorite-tag">████</span>
          <span class="favorite-tag">████████</span>
        </div>
        <div class="favorite-category">████</div>
      </div>

      <div class="favorite-item">
        <div class="favorite-item-header">
          <div class="favorite-title">█████████████ <span class="priority-badge high">高</span></div>
          <div class="favorite-actions">
            <button class="favorite-action-btn">改</button>
            <button class="favorite-action-btn">删</button>
          </div>
        </div>
        <div class="favorite-desc">███████ ████ ████████ ████ ████████</div>
        <a class="favorite-link-btn">↗ 打开链接</a>
        <div class="favorite-tags">
          <span class="favorite-tag">██████</span>
          <span class="favorite-tag">███</span>
        </div>
        <div class="favorite-category">██████</div>
      </div>

      <div class="favorite-item">
        <div class="favorite-item-header">
          <div class="favorite-title">███████████████</div>
          <div class="favorite-actions">
            <button class="favorite-action-btn">改</button>
            <button class="favorite-action-btn">删</button>
          </div>
        </div>
        <div class="favorite-desc">██████ ████████████ ███ ████████████</div>
        <a class="favorite-link-btn">↗ 打开链接</a>
        <div class="favorite-tags">
          <span class="favorite-tag">█████████</span>
        </div>
        <div class="favorite-category">███</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
